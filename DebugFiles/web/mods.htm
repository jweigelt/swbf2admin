<div class="default">
  <h2>Mods</h2>

  <div class="settings autoscale">
    <div class="item" id="mods_div_event"></div>

    <div class="item" id="mods_div_file">
      <span>Game File Mods</span>
      <table class="status embedded" id="mods_tbl_file">
        <thead>
          <tr>
            <th>Mod Name</th>
            <th>Enabled</th>
          </tr>
        </thead>
        <tbody>
          <tr id="mods_tr_nofile">
            <td colspan="2" id="mods_td_nofile"><i class="material-icons">sentiment_satisfied</i>No file mods found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="item" id="mods_div_process">
      <span>Process Mods (Memory)</span>
      <table class="status embedded" id="mods_tbl_process">
        <thead>
          <tr>
            <th>Mod Name</th>
            <th>Enabled</th>
          </tr>
        </thead>
        <tbody>
          <tr id="mods_tr_noprocess">
            <td colspan="2" id="mods_td_noprocess"><i class="material-icons">sentiment_satisfied</i>No process mods found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="text/javascript" src="/res/mods.js"></script>
